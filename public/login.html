<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CONVERGENCE · 登录</title>
<link rel="stylesheet" href="assets/styles.css">
<link rel="stylesheet" href="assets/login.css">
</head>
<body class="auth-body">
<main class="auth-shell">
  <section class="auth-brand">
    <div class="auth-brand-top">
      <svg class="auth-mark" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M3 7l9.4 9.2L29 5.5" stroke="currentColor" stroke-width="1.4" opacity=".38" fill="none"/>
        <path d="M3 25l9.4-9.2L29 26.5" stroke="currentColor" stroke-width="1.4" opacity=".38" fill="none"/>
        <path d="M12.4 16h9.2" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="26.4" cy="16" r="2.4" fill="currentColor"/>
      </svg>
      <span class="auth-wordmark">CONVERGENCE</span>
    </div>
    <h1>两条报价曲线，<br>收敛为一条。</h1>
    <p>Polymarket 事件合约与 Hyperliquid 永续之间的概率定价差，在一个操作台里被发现、执行与约束。</p>
    <dl class="auth-facts">
      <div><dt>扫描</dt><dd>事件合约 × 永续对冲</dd></div>
      <div><dt>执行</dt><dd>两腿原子化 · 缺口接管</dd></div>
      <div><dt>风控</dt><dd>限额 · 规则 · 分级熔断</dd></div>
    </dl>
    <p class="auth-foot">CONVERGENCE v2.1 · 仅供授权交易者使用</p>
  </section>

  <section class="auth-card" aria-labelledby="auth-title">
    <div class="auth-card-h">
      <span class="eyebrow">交易终端 · 登录</span>
      <h2 id="auth-title">进入操作台</h2>
      <p>使用你的工作邮箱登录。所有下单、补对冲与风控操作都会写入审计日志。</p>
    </div>
    <form id="login-form" novalidate>
      <label class="auth-field">
        <span>邮箱</span>
        <input id="email" name="email" type="email" autocomplete="username" placeholder="you@convergence.local" required>
      </label>
      <label class="auth-field">
        <span>密码</span>
        <span class="auth-password">
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
          <button type="button" id="toggle-password" aria-label="显示密码">显示</button>
        </span>
      </label>
      <div class="auth-error" id="login-error" role="alert" hidden></div>
      <button class="auth-submit" id="login-submit" type="submit">登录</button>
    </form>
    <div class="auth-demo">
      <span class="eyebrow">本地演示账号</span>
      <div class="auth-demo-btns">
        <button type="button" data-demo="admin@convergence.local" data-pass="Admin!2345">管理员 · 林</button>
        <button type="button" data-demo="trader@convergence.local" data-pass="Trader!2345">交易员 · 陈</button>
        <button type="button" data-demo="analyst@convergence.local" data-pass="Analyst!2345">只读 · 周</button>
      </div>
      <p>默认口令仅用于首次本地启动；登录后请在账户菜单修改密码。</p>
    </div>
  </section>
</main>
<script type="module" src="assets/login.js"></script>
</body>
</html>
