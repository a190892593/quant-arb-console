<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CONVERGENCE · 双策略确定性套利台</title>
<meta name="description" content="NegRisk 转换与高流动性做市：只做协议层价差与库存管理的低风险策略。">
<link rel="stylesheet" href="assets/desk.css">
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="rail-head">
      <a class="brand" href="#/overview">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M3 7l9.4 9.2L29 5.5" stroke="currentColor" stroke-width="1.4" opacity=".38" fill="none"/>
          <path d="M3 25l9.4-9.2L29 26.5" stroke="currentColor" stroke-width="1.4" opacity=".38" fill="none"/>
          <path d="M12.4 16h9.2" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          <circle cx="26.4" cy="16" r="2.4" fill="currentColor"/>
        </svg>
        <span class="brand-text"><b>CONVERGENCE</b><i>确定性双策略台</i></span>
      </a>
    </div>
    <div class="acct">
      <span class="eyebrow" id="rail-acct-label">当前账户</span>
      <div class="acct-equity num" id="rail-equity">$0.00</div>
      <div class="acct-sub" id="rail-sub"><span class="dot ok"></span>纸面账本</div>
    </div>
    <nav class="nav" aria-label="主导航">
      <a class="nav-item" href="#/overview" data-route="overview"><span class="nav-ico">◎</span><span>总览</span></a>
      <a class="nav-item" href="#/accounts" data-route="accounts"><span class="nav-ico">▤</span><span>策略账户</span></a>
      <a class="nav-item" href="#/negrisk" data-route="negrisk"><span class="nav-ico">∑</span><span>NegRisk 转换</span><em class="nav-badge" id="nav-neg">0</em></a>
      <a class="nav-item" href="#/mm" data-route="mm"><span class="nav-ico">⇄</span><span>做市台</span><em class="nav-badge" id="nav-mm">0</em></a>
      <a class="nav-item" href="#/risk" data-route="risk"><span class="nav-ico">◆</span><span>风控</span></a>
      <a class="nav-item" href="#/admin" data-route="admin" id="nav-admin" hidden><span class="nav-ico">⚙</span><span>管理</span></a>
    </nav>
    <div class="rail-foot">
      <div class="venue-line"><span class="dot" id="rail-pm-dot"></span><span id="rail-pm">Polymarket</span></div>
      <div class="venue-line"><span class="dot" id="rail-hl-dot"></span><span id="rail-hl">Hyperliquid</span></div>
      <div class="user-line">
        <span class="avatar" id="user-avatar">L</span>
        <div><b id="user-name">—</b><small id="user-email">—</small></div>
        <button class="icon-btn" id="logout-btn" title="退出登录">⏻</button>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="pulse">
        <div class="pulse-item"><span>BTC</span><b class="num" id="px-btc">—</b><em id="chg-btc">—</em></div>
        <div class="pulse-item"><span>ETH</span><b class="num" id="px-eth">—</b><em id="chg-eth">—</em></div>
      </div>
      <div class="top-right">
        <div class="acct-switch" id="acct-switch">
          <button class="acct-btn" id="acct-btn" aria-expanded="false">
            <span class="acct-code" id="acct-code">S1</span>
            <span class="acct-meta"><b id="acct-name">NegRisk 转换</b><small class="num" id="acct-equity">$0</small></span>
            <span class="chev">▾</span>
          </button>
          <div class="acct-menu" id="acct-menu" hidden></div>
        </div>
        <div class="venue-pills">
          <button class="venue-pill" id="venue-pm"><span class="dot"></span>POLYMARKET</button>
          <button class="venue-pill" id="venue-hl"><span class="dot"></span>HYPERLIQUID</button>
        </div>
        <span class="clock num" id="clock">--:--:--</span>
        <label class="toggle" title="模拟交易总开关">
          <span>模拟</span>
          <button class="switch" id="sim-switch" role="switch" aria-checked="true"><i></i></button>
        </label>
        <label class="toggle" title="自动执行">
          <span>自动</span>
          <button class="switch" id="auto-switch" role="switch" aria-checked="true"><i></i></button>
        </label>
        <button class="btn btn-danger-ghost" id="kill-btn">熔断</button>
      </div>
    </header>

    <div class="banner" id="banner" hidden>
      <b id="banner-title"></b><span id="banner-text"></span>
      <button class="link" id="banner-action">查看风控</button>
    </div>

    <main class="viewport" id="viewport">
      <section class="view" data-view="overview" id="view-overview"></section>
      <section class="view" data-view="accounts" id="view-accounts" hidden></section>
      <section class="view" data-view="negrisk" id="view-negrisk" hidden></section>
      <section class="view" data-view="mm" id="view-mm" hidden></section>
      <section class="view" data-view="risk" id="view-risk" hidden></section>
      <section class="view" data-view="admin" id="view-admin" hidden></section>
    </main>
  </div>
</div>

<div class="toasts" id="toasts"></div>
<div class="modal-root" id="modal-root" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <header><div><span class="eyebrow" id="modal-eyebrow">确认</span><h3 id="modal-title">操作</h3></div><button class="icon-btn" id="modal-x">✕</button></header>
    <div class="modal-body" id="modal-body"></div>
    <footer id="modal-actions"></footer>
  </div>
</div>
<script type="module" src="assets/app.js"></script>
</body>
</html>
